[project]
name = "rheolite"
version = "0.1.0"
description = "JupyterLite notebooks for rheology workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bqplot",
    "ipyevents>=2.0.1,<3",
    "ipycanvas>=0.9.1,<0.14",
    "ipyleaflet",
    "ipympl>=0.8.2,<0.10",
    "ipywidgets>=8.1.3,<9",
    "jupyterlab~=4.6.0",
    "jupyterlab-fasta>=3.3.0,<4",
    "jupyterlab-geojson>=3.4.0,<4",
    "jupyterlab-language-pack-fr-FR",
    "jupyterlab-language-pack-zh-CN",
    "jupyterlab-miami-nights",
    "jupyterlab-night",
    "jupyterlite-core==0.8.4",
    "jupyterlite-javascript-kernel==0.3.0",
    "jupyterlite-p5-kernel==0.3.0",
    "jupyterlite-pyodide-kernel==0.8.6",
    "matplotlib>=3.8,<4",
    "notebook~=7.6.0",
    "plotly>=5,<6",
]

[tool.uv]
package = false